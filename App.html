<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
    header{background:#0f3d56;color:white;padding:16px;font-size:18px;font-weight:700}
    .tabs{display:flex;flex-wrap:wrap;background:white;border-bottom:1px solid #d1d5db}
    .tabs button{border:0;background:white;padding:10px 12px;cursor:pointer;font-weight:600;color:#374151}
    .tabs button.active{background:#d9eaf7;color:#0f3d56}
    .panel{display:none;padding:14px}.panel.active{display:block}
    label{display:block;font-size:12px;font-weight:700;margin-top:10px;margin-bottom:4px}
    input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd5e1;border-radius:5px;background:white}
    textarea{min-height:72px}
    .save{margin-top:14px;width:100%;padding:10px;background:#1f4e78;color:white;border:0;border-radius:5px;font-weight:700;cursor:pointer}
    .msg{margin-top:10px;font-size:12px;color:#166534}
  </style>
</head>
<body>
<header>MED-TSO Secretariat Management</header>
<div class="tabs">
  <button class="active" onclick="showTab('member',this)">Member</button>
  <button onclick="showTab('meeting',this)">Meeting</button>
  <button onclick="showTab('task',this)">Task</button>
  <button onclick="showTab('tfm',this)">Task Force Member</button>
</div>

<div id="member" class="panel active">
  <label>First name</label><input id="mFirst">
  <label>Last name</label><input id="mLast">
  <label>Primary email</label><input id="mEmail" type="email">
  <label>Secondary email</label><input id="mEmail2" type="email">
  <label>TSO</label><select id="mTso"></select>
  <label>Country code</label><input id="mCountry" maxlength="2">
  <label>Role / function</label><input id="mRole">
  <label>Status</label><select id="mStatus"><option>Active</option><option>Inactive</option><option>Archived</option></select>
  <button class="save" onclick="saveMember()">Save member</button><div id="mMsg" class="msg"></div>
</div>

<div id="meeting" class="panel">
  <label>Technical Committee</label><select id="mtc"></select>
  <label>Meeting name</label><input id="mName">
  <label>Date</label><input id="mDate" type="date">
  <label>Meeting type</label><select id="mType"><option>Regular</option><option>Plenary</option><option>Workshop</option><option>Joint</option><option>Online Call</option></select>
  <label>Description</label><textarea id="mDesc"></textarea>
  <label>Status</label><select id="meetStatus"><option>Planned</option><option>Completed</option><option>Cancelled</option></select>
  <button class="save" onclick="saveMeeting()">Save meeting</button><div id="meetMsg" class="msg"></div>
</div>

<div id="task" class="panel">
  <label>Task name</label><input id="tName">
  <label>Owner</label><input id="tOwner">
  <label>Due date</label><input id="tDue" type="date">
  <label>Status</label><select id="tStatus"><option>Not Started</option><option>In Progress</option><option>Completed</option><option>On Hold</option></select>
  <button class="save" onclick="saveTask()">Save task</button><div id="tMsg" class="msg"></div>
</div>

<div id="tfm" class="panel">
  <label>Task force / study team</label><select id="tfName"></select>
  <label>Member display name</label><input id="tfMember" placeholder="Exact name from TSO Members">
  <label>TSO code</label><input id="tfTso">
  <label>Role</label><input id="tfRole" value="Member">
  <label>Status</label><select id="tfStatus"><option>Active</option><option>Inactive</option><option>Archived</option></select>
  <button class="save" onclick="saveTFM()">Save task force member</button><div id="tfMsg" class="msg"></div>
</div>

<script>
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}
function fill(id,vals){const s=document.getElementById(id);s.innerHTML='<option value="">Select...</option>'+vals.map(v=>`<option>${v}</option>`).join('')}
google.script.run.withSuccessHandler(o=>{fill('mTso',o.tsos);fill('mtc',o.tcs);fill('tfName',o.taskForces)}).getFormOptions();
function done(id,prefix){return x=>{document.getElementById(id).textContent=prefix+' '+x}}
function saveMember(){google.script.run.withSuccessHandler(done('mMsg','Saved:')).saveMember({firstName:mFirst.value,lastName:mLast.value,primaryEmail:mEmail.value,secondaryEmail:mEmail2.value,tsoCode:mTso.value,countryCode:mCountry.value,role:mRole.value,status:mStatus.value})}
function saveMeeting(){google.script.run.withSuccessHandler(done('meetMsg','Saved:')).saveMeeting({tcName:mtc.value,meetingName:mName.value,meetingDate:mDate.value,meetingType:mType.value,description:mDesc.value,status:meetStatus.value})}
function saveTask(){google.script.run.withSuccessHandler(done('tMsg','Saved:')).saveTask({taskName:tName.value,owner:tOwner.value,dueDate:tDue.value,status:tStatus.value})}
function saveTFM(){google.script.run.withSuccessHandler(done('tfMsg','Saved:')).saveTaskForceMember({taskForce:tfName.value,memberName:tfMember.value,tsoCode:tfTso.value,role:tfRole.value,status:tfStatus.value})}
</script>
</body>
</html>
